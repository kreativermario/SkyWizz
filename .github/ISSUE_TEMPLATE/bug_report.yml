name: "🐛 Bug Report"
description: We broke something, again
title: "[Bug]: "
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for reporting an issue!** Please make sure you read our [issue guidelines](https://github.com/guacamoleninja/guacamoleninja-bot/blob/main/.github/CONTRIBUTING.md) first, then fill out the fields below.

        If you're unsure whether the issue you're having is a bug, you can post in [Discussions](https://github.com/guacamoleninja/guacamoleninja-bot/discussions) instead.

  - type: textarea
    id: bug-steps
    attributes:
      label: What are the steps to reproduce this issue?
      placeholder: |
        1. Run `pnpm install`
        2. Run `docker compose -f docker-compose.local.yml up`
        3. …
        4. See error
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: What happens?
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: bug-expectation
    attributes:
      label: What were you expecting to happen?
      description: A clear and concise description of what was supposed to happen.
    validations:
      required: true

  - type: textarea
    id: bug-logs
    attributes:
      label: Paste any relevant logs, error output, etc.
      description: |
        Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
        (If it's long, please paste to https://gist.github.com/ and insert the link here.)
      render: shell

  - type: textarea
    id: bug-context
    attributes:
      label: Additional context
      description: Add any other context you can provide about the problem here.

  - type: markdown
    attributes:
      value: |
        ----

        # Details of your host machine (the device you're running guacamoleninja-bot on)

  - type: dropdown
    id: host-os
    attributes:
      label: What OS are you seeing the problem on?
      options:
        - Windows
        - macOS
        - Linux/WSL
        - Other
      multiple: true
    validations:
      required: true

  - type: input
    id: host-os-version
    attributes:
      label: What OS version does it have installed?
      placeholder: "e.g. macOS 14.5, Windows 11"
    validations:
      required: true

  - type: input
    id: host-node-version
    attributes:
      label: What Node.js version are you using?
      placeholder: "e.g. 24.0.0"
    validations:
      required: true

  - type: input
    id: host-ide
    attributes:
      label: Which IDE or development environment are you using? (please include the version)
      placeholder: "e.g. Visual Studio Code 1.90, WebStorm 2024.1"
    validations:
      required: true
