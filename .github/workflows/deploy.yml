name: Deploy

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

env:
  STACK_NAME: skywizz-bot
  PORTAINER_ENDPOINT_ID: "9"

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: development
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Get image tag
        id: meta
        run: echo "image=${{ secrets.HARBOR_REGISTRY_URL }}/skywizz/skywizz-bot:$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    environment: development
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Read compose file
        id: compose
        run: echo "content=$(jq -Rs '.' < docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Get stack ID if it exists
        id: stack
        run: |
          ID=$(curl -sf \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks?filters=%7B%22EndpointID%22%3A${{ env.PORTAINER_ENDPOINT_ID }}%7D" | \
            jq -r --arg name "$STACK_NAME" '.[] | select(.Name == $name) | .Id // empty')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Update existing stack
        if: steps.stack.outputs.id != ''
        env:
          BOT_IMAGE: ${{ needs.build-and-push.outputs.image }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          COMPOSE_CONTENT: ${{ steps.compose.outputs.content }}
        run: |
          PAYLOAD=$(jq -n \
            --arg stackFileContent "$COMPOSE_CONTENT" \
            --arg botImage "$BOT_IMAGE" \
            --arg botToken "$BOT_TOKEN" \
            --arg clientId "$CLIENT_ID" \
            --arg pgUser "$POSTGRES_USER" \
            --arg pgPassword "$POSTGRES_PASSWORD" \
            --arg pgDb "$POSTGRES_DB" \
            --arg timezone "$TIMEZONE" \
            '{
              stackFileContent: $stackFileContent,
              env: [
                {name: "BOT_IMAGE", value: $botImage},
                {name: "BOT_TOKEN", value: $botToken},
                {name: "CLIENT_ID", value: $clientId},
                {name: "POSTGRES_USER", value: $pgUser},
                {name: "POSTGRES_PASSWORD", value: $pgPassword},
                {name: "POSTGRES_DB", value: $pgDb},
                {name: "TIMEZONE", value: $timezone}
              ],
              prune: true,
              pullImage: true
            }')
          curl -sf -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${{ steps.stack.outputs.id }}?endpointId=${{ env.PORTAINER_ENDPOINT_ID }}" \
            -d "$PAYLOAD"

      - name: Create new stack
        if: steps.stack.outputs.id == ''
        env:
          BOT_IMAGE: ${{ needs.build-and-push.outputs.image }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          COMPOSE_CONTENT: ${{ steps.compose.outputs.content }}
        run: |
          PAYLOAD=$(jq -n \
            --arg name "$STACK_NAME" \
            --arg stackFileContent "$COMPOSE_CONTENT" \
            --arg botImage "$BOT_IMAGE" \
            --arg botToken "$BOT_TOKEN" \
            --arg clientId "$CLIENT_ID" \
            --arg pgUser "$POSTGRES_USER" \
            --arg pgPassword "$POSTGRES_PASSWORD" \
            --arg pgDb "$POSTGRES_DB" \
            --arg timezone "$TIMEZONE" \
            '{
              name: $name,
              stackFileContent: $stackFileContent,
              env: [
                {name: "BOT_IMAGE", value: $botImage},
                {name: "BOT_TOKEN", value: $botToken},
                {name: "CLIENT_ID", value: $clientId},
                {name: "POSTGRES_USER", value: $pgUser},
                {name: "POSTGRES_PASSWORD", value: $pgPassword},
                {name: "POSTGRES_DB", value: $pgDb},
                {name: "TIMEZONE", value: $timezone}
              ]
            }')
          curl -sf -X POST \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/create/standalone/string?endpointId=${{ env.PORTAINER_ENDPOINT_ID }}" \
            -d "$PAYLOAD"
