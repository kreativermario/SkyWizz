name: Build & Deploy Docker Compose (Dev)

on:
  push:
    branches: ["dev"]

  workflow_dispatch:
    inputs:
      BRANCH:
        description: "Branch to build"
        required: true
        default: "dev"

env:
  IMAGE_NAME: ${{ secrets.HARBOR_REGISTRY_URL }}/skywizz/skywizz
  PORTAINER_ENDPOINT_ID: 9
  PORTAINER_STACK_NAME: skywizz-dev
  CONFIG_VERSION: 0.1
  BOT_PREFIX: "!"
  BOT_STATUS: "Use !help by default - Powered By SkyWizz.py"
  PYTHON_ENV: "development"
  LOG_LEVEL: "INFO"
  TIMEZONE: "Europe/Lisbon"

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: development

    outputs:
      image_tag: ${{ steps.get-sha.outputs.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.BRANCH || github.ref_name }}

    - name: Get short commit SHA
      id: get-sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.HARBOR_REGISTRY_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}:${{ steps.get-sha.outputs.sha }}
  deploy:
    runs-on: self-hosted
    environment: development
    
    steps:
    - name: Clone Repository
      uses: actions/checkout@v2

    - name: Replace image placeholder in docker-compose.prod.yml
      run: |
        sed -i "s|REPLACE_IMAGE_NAME|${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}|g" docker-compose.prod.yml

    - name: Deploy Stack
      uses: kgierke/portainer-stack-deployment@v1
      with:
        portainer-url: ${{ secrets.PORTAINER_URL }}
        portainer-username: ${{ secrets.PORTAINER_USERNAME }}
        portainer-password: ${{ secrets.PORTAINER_PASSWORD }}
        portainer-endpoint: ${{ env.PORTAINER_ENDPOINT_ID }}
        name: ${{ env.PORTAINER_STACK_NAME }}
        file: docker-compose.prod.yml
        variables: >-
          {
            "CONFIG_VERSION": "${{ env.CONFIG_VERSION }}",
            "BOT_TOKEN": "${{ secrets.DISCORD_BOT_TOKEN }}",
            "BOT_PREFIX": "${{ env.BOT_PREFIX }}",
            "BOT_STATUS": "${{ env.BOT_STATUS }}",
            "PYTHON_ENV": "${{ env.PYTHON_ENV }}",
            "LOG_LEVEL": "${{ env.LOG_LEVEL }}",
            "TIMEZONE": "${{ env.TIMEZONE }}"
          }
