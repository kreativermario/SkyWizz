name: Deploy

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

env:
  STACK_NAME: skywizz-bot
  VAULT_PATH: automation/data/skywizz
  VAULT_PORTAINER_PATH: automation/data/portainer

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: development
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Load Harbor credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.HCP_VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.HCP_VAULT_ROLE_ID }}
          secretId: ${{ secrets.HCP_VAULT_SECRET_ID }}
          secrets: |
            ${{ env.VAULT_PATH }} HARBOR_REGISTRY_URL | HARBOR_REGISTRY_URL ;
            ${{ env.VAULT_PATH }} HARBOR_USERNAME | HARBOR_USERNAME ;
            ${{ env.VAULT_PATH }} HARBOR_PASSWORD | HARBOR_PASSWORD

      - name: Get image tag
        id: meta
        env:
          HARBOR_REGISTRY_URL: ${{ steps.vault.outputs.HARBOR_REGISTRY_URL }}
        run: |
          REGISTRY=$(echo "$HARBOR_REGISTRY_URL" | tr -d '\n\r' | xargs)
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY%/}"
          if [ -z "$REGISTRY" ]; then
            echo "HARBOR_REGISTRY_URL is empty after normalization." >&2
            exit 1
          fi
          TAG=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/skywizz/skywizz-bot:$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault.outputs.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    environment: development
    needs: build-and-push

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Load deploy secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.HCP_VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.HCP_VAULT_ROLE_ID }}
          secretId: ${{ secrets.HCP_VAULT_SECRET_ID }}
          secrets: |
            ${{ env.VAULT_PORTAINER_PATH }} api_key | PORTAINER_API_TOKEN ;
            ${{ env.VAULT_PATH }} PORTAINER_URL | PORTAINER_URL ;
            ${{ env.VAULT_PATH }} PORTAINER_ENDPOINT_ID | PORTAINER_ENDPOINT_ID ;
            ${{ env.VAULT_PATH }} HARBOR_REGISTRY_URL | HARBOR_REGISTRY_URL ;
            ${{ env.VAULT_PATH }} DISCORD_BOT_TOKEN | BOT_TOKEN ;
            ${{ env.VAULT_PATH }} DISCORD_CLIENT_ID | CLIENT_ID ;
            ${{ env.VAULT_PATH }} POSTGRES_USER | POSTGRES_USER ;
            ${{ env.VAULT_PATH }} POSTGRES_PASSWORD | POSTGRES_PASSWORD ;
            ${{ env.VAULT_PATH }} POSTGRES_DB | POSTGRES_DB ;
            ${{ env.VAULT_PATH }} TIMEZONE | TIMEZONE

      - name: Resolve image ref
        id: image
        env:
          HARBOR_REGISTRY_URL: ${{ steps.vault.outputs.HARBOR_REGISTRY_URL }}
        run: |
          REGISTRY=$(echo "$HARBOR_REGISTRY_URL" | tr -d '\n\r' | xargs)
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY%/}"
          echo "ref=$REGISTRY/skywizz/skywizz-bot:${{ needs.build-and-push.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Read docker-compose file content safely
        id: read_compose
        run: |
          CONTENT=$(jq -Rs '.' < docker-compose.prod.yml)
          echo "COMPOSE_CONTENT=$CONTENT" >> $GITHUB_ENV

      - name: Check if stack exists
        id: check_stack
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks
          method: GET
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 60000

      - name: Extract stack ID if stack exists
        id: extract_stack_id
        run: |
          STACK_ID=$(echo '${{ steps.check_stack.outputs.response }}' | jq -r 'first(.[] | select(.Name=="${{ env.STACK_NAME }}" and (.EndpointId|tostring)=="${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}") | .Id) // ""' | tr -d '\r\n')
          {
            echo "stack_id<<EOF"
            echo "$STACK_ID"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update existing stack in Portainer
        if: steps.extract_stack_id.outputs.stack_id != ''
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks/${{ steps.extract_stack_id.outputs.stack_id }}?endpointId=${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}&method=string
          method: PUT
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 60000
          data: |
            {
              "env": [
                {"name": "BOT_IMAGE", "value": "${{ steps.image.outputs.ref }}"},
                {"name": "BOT_TOKEN", "value": "${{ steps.vault.outputs.BOT_TOKEN }}"},
                {"name": "CLIENT_ID", "value": "${{ steps.vault.outputs.CLIENT_ID }}"},
                {"name": "POSTGRES_USER", "value": "${{ steps.vault.outputs.POSTGRES_USER }}"},
                {"name": "POSTGRES_PASSWORD", "value": "${{ steps.vault.outputs.POSTGRES_PASSWORD }}"},
                {"name": "POSTGRES_DB", "value": "${{ steps.vault.outputs.POSTGRES_DB }}"},
                {"name": "TIMEZONE", "value": "${{ steps.vault.outputs.TIMEZONE }}"}
              ],
              "stackFileContent": ${{ env.COMPOSE_CONTENT }},
              "prune": true,
              "pullImage": true
            }

      - name: Deploy Stack to Portainer (create new)
        if: steps.extract_stack_id.outputs.stack_id == ''
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks/create/standalone/string?endpointId=${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}
          method: POST
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 60000
          data: |
            {
              "env": [
                {"name": "BOT_IMAGE", "value": "${{ steps.image.outputs.ref }}"},
                {"name": "BOT_TOKEN", "value": "${{ steps.vault.outputs.BOT_TOKEN }}"},
                {"name": "CLIENT_ID", "value": "${{ steps.vault.outputs.CLIENT_ID }}"},
                {"name": "POSTGRES_USER", "value": "${{ steps.vault.outputs.POSTGRES_USER }}"},
                {"name": "POSTGRES_PASSWORD", "value": "${{ steps.vault.outputs.POSTGRES_PASSWORD }}"},
                {"name": "POSTGRES_DB", "value": "${{ steps.vault.outputs.POSTGRES_DB }}"},
                {"name": "TIMEZONE", "value": "${{ steps.vault.outputs.TIMEZONE }}"}
              ],
              "name": "${{ env.STACK_NAME }}",
              "fromAppTemplate": false,
              "stackFileContent": ${{ env.COMPOSE_CONTENT }}
            }
