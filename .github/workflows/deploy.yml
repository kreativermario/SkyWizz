name: Build & Deploy Docker Compose (Dev)

on:
  push:
    branches: ["dev"]

  workflow_dispatch:
    inputs:
      BRANCH:
        description: "Branch to build"
        required: true
        default: "dev"

env:
  IMAGE_NAME: ${{ secrets.HARBOR_REGISTRY_URL }}/skywizz/skywizz

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: development

    outputs:
      image_tag: ${{ steps.get-sha.outputs.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.BRANCH || github.ref_name }}

    - name: Get short commit SHA
      id: get-sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.HARBOR_REGISTRY_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}:${{ steps.get-sha.outputs.sha }}
